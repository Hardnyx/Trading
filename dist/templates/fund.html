<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Plantillas del fondo simulado</title>
  </head>
  <body>
    <!-- fund: published state of the simulated fund; presentation and a local what-if mix. -->

    <template id="fund-panel">
      <section class="panel composition-report fund-panel" id="fund">
        <div class="panel-header">
          <h2 class="panel-title">
            <span class="panel-index">F</span>FONDO SIMULADO · {{policy}}
          </h2>
          <span class="panel-meta">{{statusLabel}}</span>
        </div>
        {{{notice}}}
        <p class="composition-source">{{source}}</p>
        <div class="composition-metrics">{{{metrics}}}</div>
        <div class="composition-brief">
          <h3>ÚLTIMA REVISIÓN · {{reviewDate}}</h3>
          <p>{{decision}}</p>
          <p>{{rule}}</p>
          <p>{{evidence}}</p>
        </div>
        <div class="table-wrap">
          <table class="composition-positions">
            <thead>
              <tr>
                <th>ACTIVO</th>
                <th>PESO</th>
                <th>OBJETIVO</th>
                <th>ACCIONES</th>
                <th>ACCIONES ENTERAS</th>
                <th>PRECIO</th>
                <th>VALOR</th>
              </tr>
            </thead>
            <tbody>
              {{{rows}}}
            </tbody>
          </table>
        </div>
        {{{orders}}}
        {{{shadow}}}
        {{{mixer}}}
        <div class="chart-footnote">{{footnote}}</div>
      </section>
    </template>

    <template id="fund-row">
      <tr>
        <td><button class="text-button symbol" data-detail="{{symbol}}">{{symbol2}}</button><div class="muted small">{{name}}</div></td>
        <td class="mono">{{weight}}</td>
        <td class="mono">{{target}}</td>
        <td class="mono">{{shares}}</td>
        <td class="mono">{{whole}}</td>
        <td class="mono">{{price}}</td>
        <td class="mono">{{value}}</td>
      </tr>
    </template>

    <template id="fund-orders">
      <div class="composition-contributions">
        <h3>ÓRDENES DE LA ÚLTIMA REVISIÓN · {{date}}</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ACTIVO</th><th>OPERACIÓN</th><th>ACCIONES</th><th>ACCIONES ENTERAS</th><th>PRECIO</th></tr></thead>
            <tbody>{{{rows}}}</tbody>
          </table>
        </div>
      </div>
    </template>

    <template id="fund-order-row">
      <tr><td>{{symbol}}</td><td>{{side}}</td><td class="mono">{{shares}}</td><td class="mono">{{whole}}</td><td class="mono">{{price}}</td></tr>
    </template>

    <template id="fund-mixer">
      <div class="composition-contributions fund-mixer">
        <h3>AJUSTAR MI MEZCLA · CÁLCULO LOCAL</h3>
        <p class="muted small">Variante personal sobre los mismos ETF y precios. No cambia el fondo publicado, que sigue los pesos registrados.</p>
        <div class="fund-mixer-controls">
          <div class="field">
            <div class="field-topline"><label for="fund-mix-equity">Acciones</label><output id="fund-mix-equity-out">{{equity}}</output></div>
            <input id="fund-mix-equity" type="range" min="0" max="100" step="1" value="{{equityValue}}" data-fund-mix="equity" />
          </div>
          <div class="field">
            <div class="field-topline"><label for="fund-mix-us">EE. UU. dentro de acciones</label><output id="fund-mix-us-out">{{us}}</output></div>
            <input id="fund-mix-us" type="range" min="0" max="100" step="1" value="{{usValue}}" data-fund-mix="usShare" />
          </div>
          <div class="field">
            <div class="field-topline"><label for="fund-mix-cash">Efectivo</label><output id="fund-mix-cash-out">{{cash}}</output></div>
            <input id="fund-mix-cash" type="range" min="0" max="50" step="1" value="{{cashValue}}" data-fund-mix="cash" />
          </div>
          <div class="field">
            <div class="field-topline"><label for="fund-mix-capital">Capital (USD)</label></div>
            <input id="fund-mix-capital" type="number" min="1000" max="100000000" step="1000" value="{{capital}}" data-fund-mix="capital" />
          </div>
          <button class="button" data-action="fund-mix-reset">Volver a la mezcla registrada</button>
        </div>
        <div id="fund-mix-result">{{{result}}}</div>
      </div>
    </template>

    <template id="fund-mix-result">
      <p class="muted small">{{summary}}</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ACTIVO</th><th>PESO</th><th>ACCIONES ENTERAS</th><th>MONTO</th><th>PRECIO</th></tr></thead>
          <tbody>{{{rows}}}</tbody>
        </table>
      </div>
    </template>

    <template id="fund-mix-row">
      <tr><td>{{symbol}}</td><td class="mono">{{weight}}</td><td class="mono">{{whole}}</td><td class="mono">{{amount}}</td><td class="mono">{{price}}</td></tr>
    </template>

    <template id="fund-shadow">
      <div class="composition-contributions fund-shadow">
        <h3>SOMBRA · {{policy}} · NO OPERAR</h3>
        <p class="muted small">{{summary}}</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ACTIVO</th><th>PESO</th><th>OBJETIVO</th><th>ACCIONES ENTERAS</th><th>VALOR</th></tr></thead>
            <tbody>{{{rows}}}</tbody>
          </table>
        </div>
      </div>
    </template>

    <template id="fund-shadow-row">
      <tr><td>{{symbol}}</td><td class="mono">{{weight}}</td><td class="mono">{{target}}</td><td class="mono">{{whole}}</td><td class="mono">{{value}}</td></tr>
    </template>

    <template id="fund-notice">
      <div class="notice">{{message}}</div>
    </template>
  </body>
</html>
