<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Plantillas de interfaz</title>
  </head>
  <body>
    <!-- Ex ante composition controls and the recorded model proposal. -->

    <template id="composition-controls">
      <details class="composition-controls">
        <summary>
          LÍMITES DE LA PROPUESTA · {{months}} MESES · CVaR MÁX. {{budget}}
        </summary>
        <div class="composition-fields">
          {{{fields}}}
          <div class="field">
            <label for="composition-universe-limit">MUESTRA MÁXIMA DEL OPTIMIZADOR</label>
            <select id="composition-universe-limit" data-setting="compositionUniverseLimit" data-numeric>{{{universeOptions}}}</select>
            <small>Más activos requieren más tiempo y memoria. El catálogo completo permanece disponible en Research y en el monitor.</small>
          </div>
          <div class="field">
            <label for="composition-volatility">VOLATILIDAD / RIESGO</label>
            <select id="composition-volatility" data-setting="volatilityMode">
              <option value="hybrid" {{{volatilityHybridSelected}}}>GJR validado + EWMA (automático)</option>
              <option value="ewma" {{{volatilityEWMASelected}}}>EWMA diario sin saltos no calibrados</option>
              <option value="legacy" {{{volatilityLegacySelected}}}>Merton legado · solo comparación (saltos no calibrados)</option>
            </select>
          </div>
          <div class="field">
            <label for="composition-dividend-policy">DIVIDENDOS · FLUJO DE CAJA</label>
            <select id="composition-dividend-policy" data-setting="dividendPolicy">
              <option value="cash" {{{dividendsCashSelected}}}>Cobrar en efectivo</option>
              <option value="reinvest" {{{dividendsReinvestSelected}}}>Reinvertir (rendimiento total)</option>
            </select>
          </div>
          <div class="field">
            <label for="composition-dividend-tax">RETENCIÓN SUPUESTA EN DIVIDENDOS</label>
            <div class="input-unit">
              <input id="composition-dividend-tax" type="number" min="0" max="100" step="1"
                value="{{dividendWithholdingValue}}" data-setting="dividendWithholding"
                data-scale="100"><span>%</span>
            </div>
          </div>
          <div class="field">
            <label for="composition-cash-yield">RENDIMIENTO NETO DEL EFECTIVO USD</label>
            <div class="input-unit">
              <input id="composition-cash-yield" type="number" min="0" max="20" step="0.05"
                value="{{cashYieldValue}}" data-setting="cashYield"
                data-scale="100"><span>%/año</span>
            </div>
            <small>Tasa contractual de tu cuenta, neta de comisiones. 0% supone efectivo no remunerado.</small>
          </div>
          <div class="field">
            <label for="composition-horizon">HORIZONTE</label
            ><select
              id="composition-horizon"
              data-setting="horizon"
              data-numeric
            >
              {{{horizons}}}
            </select>
          </div>
        </div>
        <p>
          Solo posiciones largas. Pesos en pasos de 5 puntos, sin
          apalancamiento; con costos iniciales y efectivo para retiros. SHY
          tiene su propio límite además del global por activo y del conjunto
          Treasury. El tope de oportunidad requiere evidencia prospectiva
          revisada. Dividendos distribuidos se extraen del rendimiento total
          ajustado y la retención es configurable (0% no implica exención tributaria).
          La retención también se descuenta al reinvertir. El flujo se aproxima
          de forma uniforme; no sustituye fechas de pago confirmadas.
        </p>
      </details>
    </template>

    <template id="composition-field">
      <div class="field">
        <label for="composition-{{key}}">{{label}}</label>
        <div class="input-unit">
          <input
            id="composition-{{key}}"
            type="number"
            min="{{min}}"
            max="{{max}}"
            step="{{step}}"
            value="{{value}}"
            data-composition-rule="{{key}}"
            data-scale="{{scale}}"
          /><span>{{unit}}</span>
        </div>
      </div>
    </template>

    <template id="composition-horizon-option">
      <option value="{{value}}" {{{selected}}}>{{label}}</option>
    </template>

    <template id="composition-notice">
      <div class="notice">{{message}}</div>
    </template>

    <template id="financial-coverage">
      <details class="panel financial-coverage">
        <summary>VIGENCIA DE FUNDAMENTALES · {{gaps}} CON INFORME POSTERIOR · {{missing}} SIN BPA · {{total}} EMPRESAS</summary>
        <p>Período contable, presentación y captura son fechas diferentes. Una descarga reciente no convierte el BPA antiguo en actual. Las empresas con informe posterior sin conciliar se excluyen de nuevas propuestas; sus posiciones existentes se conservan para revisión.</p>
        <div class="table-wrap"><table><thead><tr><th>ACTIVO</th><th>PERÍODO BPA</th><th>MÉTODO</th><th>PRESENTADO</th><th>CAPTURA XBRL</th><th>ÚLTIMO INFORME</th><th>COBERTURA</th><th>FUENTE</th></tr></thead><tbody>{{{rows}}}</tbody></table></div>
        <p>La captura usa la zona horaria local configurada en tu navegador, sin solicitar ubicación; se conserva el instante original en UTC. Sin informe posterior detectado no garantiza que todas las fuentes estén completas. Los 8-K y las enmiendas no se interpretan automáticamente como un nuevo período de BPA.</p>
      </details>
    </template>
    <template id="financial-coverage-row">
      <tr><td><button class="symbol" data-detail="{{symbol}}">{{symbol}}</button></td><td>{{period}}</td><td>{{method}}</td><td>{{filed}}</td><td>{{observed}}<small>{{originalObserved}}</small></td><td>{{latest}}</td><td>{{status}}</td><td><a href="{{sourceUrl}}" target="_blank" rel="noopener noreferrer">SEC</a></td></tr>
    </template>

    <template id="price-monitor">
      <details class="panel price-monitor" {{{open}}}>
        <summary>MONITOR DE PRECIOS · {{available}} / {{total}} CON HISTORIA SUFICIENTE · CORTE {{asOf}}</summary>
        <p>Cierres de Yahoo para todo el catálogo; el compositor analiza un subconjunto por separado. {{priceOnly}} acciones tienen BPA ausente o no conciliado y pueden observarse aquí sin habilitar nuevas compras fundamentales.</p>
        <label for="price-monitor-filter">MOSTRAR</label>
        <select id="price-monitor-filter"><option value="all" {{{allSelected}}}>Todo el catálogo</option><option value="price_only" {{{priceSelected}}}>Acciones sin BPA conciliado</option><option value="held" {{{heldSelected}}}>Posiciones de mi cuenta o cartera</option><option value="events" {{{eventsSelected}}}>Rupturas y cruces observados</option></select>
        <div class="table-wrap"><table><thead><tr><th>ACTIVO</th><th>CIERRE</th><th>FECHA</th><th>COBERTURA</th><th>TENDENCIA</th><th>OBSERVACIÓN</th><th>RETORNO 126 SES.</th><th>DIST. MA200</th><th>CAÍDA DESDE MÁX. 252</th><th>VOL. 63 ANUAL</th><th>VOL. 21 / 63</th></tr></thead><tbody>{{{rows}}}</tbody></table></div>
        <p>Medias, retornos, máximos y cruces calculados con cierres ajustados por el proveedor por splits y distribuciones; describen rendimiento total histórico, no niveles de órdenes sobre el precio sin ajustar. Volatilidad de retornos logarítmicos, anualizada con 252 sesiones. MA50/MA200: medias de 50/200 cierres; rupturas frente a las 63 sesiones previas, excluyendo la actual.</p>
        <p>Una ruptura o cruce permite revisar una posible entrada o salida; no demuestra rentabilidad futura. Este monitor no suministra retornos esperados al optimizador, no ejecuta operaciones ni tiene validación como estrategia. Datos al cierre, sin cotizaciones intradía.</p>
      </details>
    </template>
    <template id="price-monitor-row">
      <tr><td><button class="symbol" data-detail="{{symbol}}">{{symbol}}</button><small>{{held}}</small></td><td>{{price}}</td><td>{{date}}<small>{{observed}}</small></td><td>{{coverage}}</td><td>{{trend}}</td><td>{{event}}</td><td>{{momentum}}</td><td>{{distance}}</td><td>{{drawdown}}</td><td>{{volatility}}</td><td>{{ratio}}</td></tr>
    </template>
    <template id="price-monitor-empty">
      <tr><td colspan="11">Sin activos para este filtro.</td></tr>
    </template>

    <template id="robustness-running">
      <section class="panel robustness-report is-busy" aria-live="polite">
        <div class="panel-header"><h2 class="panel-title">COMPARACIÓN ROBUSTA</h2></div>
        <p class="robustness-summary loading">{{progress}} · Las posiciones se conservan durante el cálculo.</p>
        <button class="button ghost" data-action="cancel-robustness">Cancelar comparación</button>
      </section>
    </template>
    <template id="robustness-report">
      <section class="panel robustness-report">
        <div class="panel-header"><h2 class="panel-title">COMPARACIÓN ROBUSTA · EXPERIMENTAL</h2><span class="panel-meta">CORTE {{asOf}} · {{months}} MESES</span></div>
        <div class="robustness-summary"><strong>{{decision}}</strong><p>Comparador: {{source}}. {{candidates}} carteras examinadas; {{finalists}} finalistas verificadas con otra semilla.</p><p>{{incumbentNotice}}</p></div>
        <div class="robustness-weights"><h3>PESOS CANDIDATOS</h3>{{{weights}}}</div>
        <div class="table-wrap"><table class="robustness-scenarios"><thead><tr>
          <th>HIPÓTESIS</th><th>MEDIANA · MANTENER</th><th>MEDIANA · CANDIDATA</th><th>CVaR 95%</th><th>PROB. PÉRDIDA</th><th>MEJORA EQUIVALENTE</th><th>LÍMITE INFERIOR MC</th>
        </tr></thead><tbody>{{{scenarios}}}</tbody></table></div>
        {{{transition}}}
        <div class="robustness-summary"><p>Costos de transición: {{cost}}. Mejora mínima exigida en cada modelo: {{threshold}}. El límite inferior ajusta el error de simulación por la cantidad de comparaciones.</p><p>Sin historial suficiente o método compatible para el estrés de margen: {{missingMargins}}. No se sustituyeron esos datos por un BPA inventado.</p><p>La búsqueda es finita. Las cifras dependen de los supuestos y no acreditan capacidad predictiva. El estrés de margen no es una normalización contable del BPA. No se ejecutan operaciones.</p>{{{copy}}}</div>
      </section>
    </template>
    <template id="robustness-weight">
      <span><b class="symbol">{{symbol}}</b> {{weight}}</span>
    </template>
    <template id="robustness-scenario">
      <tr><td>{{name}}</td><td>{{currentMedian}}</td><td>{{median}}</td><td>{{cvar}}</td><td>{{probability}}</td><td>{{gain}}</td><td>{{lower}}</td></tr>
    </template>
    <template id="robustness-copy">
      <button class="button ghost" data-action="use-robust-weights">Usar pesos para simular</button>
    </template>

    <template id="robustness-transition">
      <details class="robustness-transition composition-method">
        <summary>CAMBIOS FRENTE A LA REFERENCIA Y EFECTIVO</summary>
        <p>{{notice}}</p>
        <div class="table-wrap"><table><thead><tr>
          <th>ACTIVO</th><th>CAMBIO</th><th>PESO ACTUAL</th><th>PESO CANDIDATO</th>
          <th>VALOR ACTUAL</th><th>VALOR CANDIDATO</th><th>DIFERENCIA USD</th>
          <th>CANTIDAD EST.</th><th>PRECIO DEL CORTE</th><th>COSTO EST.</th>
        </tr></thead><tbody>{{{rows}}}</tbody></table></div>
        <p>Efectivo inicial {{initialCash}} + ventas {{sells}} − compras {{buys}} − costos {{total}} = efectivo final {{endingCash}}. Conciliación verificada antes de redondear.</p>
        <p>Rotación (suma de cambios absolutos / 2): {{turnover}}. Comisiones {{commission}} · spread {{spread}} · deslizamiento {{slippage}} · impuesto supuesto {{tax}} (tasa configurada {{taxRate}}).</p>
        <p>Los pesos candidatos se aplican al capital después de costos. Cantidades fraccionarias indicativas con precios del corte; no incluyen redondeo a lotes, ejecución real ni precios en vivo. La tasa fiscal configurada no acredita el impuesto aplicable.</p>
      </details>
    </template>
    <template id="robustness-transition-row">
      <tr><td><button class="symbol" data-detail="{{symbol}}">{{symbol}}</button></td><td>{{action}}<small>{{note}}</small></td><td>{{from}}</td><td>{{to}}</td>
        <td>{{currentValue}}</td><td>{{targetValue}}</td><td>{{change}}</td><td>{{quantity}}</td><td>{{price}}</td><td>{{cost}}</td></tr>
    </template>

    <template id="composition-report">
      <section class="panel composition-report">
        <div class="panel-header">
          <h2 class="panel-title">PROPUESTA EX ANTE</h2>
          <span class="panel-meta">CORTE {{asOf}}</span>
        </div>
        {{{notice}}}
        <p class="composition-source">{{sourceNotice}}</p>
        <div class="composition-metrics">{{{metrics}}}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ACTIVO</th>
                <th>PESO PROPUESTO</th>
                <th>ANCLA ADVERSA / AÑO</th>
                <th>ANCLA MODO / AÑO</th>
                <th>ANCLA FAVORABLE / AÑO</th>
                <th>DATO PUBLICADO / SUPUESTOS DE VALORACIÓN</th>
              </tr>
            </thead>
            <tbody>
              {{{rows}}}
            </tbody>
          </table>
        </div>
        <div class="composition-contributions">
          <h3>APORTES DE LA CARTERA SIMULADA</h3>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>ACTIVO</th><th>PESO</th>
                <th>APORTE A RETORNO MEDIO</th>
                <th>APORTE A PÉRDIDA EN PEOR 5%</th>
                <th>PORCIÓN DE VARIANZA INICIAL</th>
              </tr></thead>
              <tbody>{{{attributionRows}}}</tbody>
            </table>
          </div>
          <p class="composition-attribution-note">{{attributionNotice}}</p>
        </div>
        <div class="composition-brief">
          <p>Motor {{engineVersion}} · Corte {{asOf}} · {{simulated}} activos simulados · {{verificationPaths}} escenarios de verificación.</p>
          <p><strong>EXPOSICIÓN PRINCIPAL:</strong> {{concentration}} · Restricciones próximas: {{nearLimits}}.</p>
          <p>{{globalLimitNote}}</p>
          <p>{{exposureSummary}}</p>
          <p>{{incomeSummary}}</p>
          <p>{{shyExplanation}}</p>
          <p><strong>RIESGO TODAVÍA NO VALIDADO:</strong> {{stochasticTail}}.</p>
        </div>
        <details class="composition-method">
          <summary>SUPUESTOS, COMPARACIONES Y VALIDACIÓN · VER DETALLES</summary>
          <p><strong>CORRELACIONES OBSERVADAS · 500 SESIONES:</strong> {{overlapSummary}}.</p>
          <p>{{exposureWarning}}</p>
          <p>{{lookthroughSummary}}</p>
          <p>{{dividendCalendarSummary}}</p>
          <div class="table-wrap">
            <table class="composition-dividend-calendar">
              <thead><tr><th>ACTIVO</th><th>EXDIVIDENDO</th><th>PAGO PREVISTO</th><th>POR PARTICIPACIÓN</th><th>FUENTE</th></tr></thead>
              <tbody>{{{dividendCalendarRows}}}</tbody>
            </table>
          </div>
          <div class="table-wrap">
            <table class="composition-etf-holdings">
              <thead><tr>
                <th>ETF</th><th>PESO</th><th>GRUPO</th>
                <th>FECHA CARTERA</th><th>PRIMERA CAPTURA</th>
                <th>COBERTURA FECHADA</th><th>PRINCIPALES POSICIONES</th><th>FUENTE</th>
              </tr></thead>
              <tbody>{{{etfHoldingsRows}}}</tbody>
            </table>
          </div>
          <p>
            Universo: {{published}} instrumentos publicados,
            {{eligible}} analizables (incluido efectivo sintético),
            {{simulated}} simulados en esta ejecución. La propuesta se
            optimiza sobre esta muestra, no sobre todo el catálogo.
          </p>
          <p>
            Selección según el objetivo del mandato entre {{evaluated}}
            candidatas; {{feasible}} cumplieron los límites de búsqueda.
            {{searchPaths}} escenarios compartidos para comparar y
            {{verificationPaths}} nuevos para comprobar la elegida. Horizonte:
            {{months}} meses.
          </p>
          <p>
            Motor {{engineVersion}} · semilla {{seed}} · tope de correlación
            {{maxCorr}} sobre {{dependenceMethod}} ({{dependenceObservations}}
            sesiones). El riesgo total permanece en Monte Carlo.
          </p>
          <p>
            Riesgo condicional: {{volatilityUsed}} · activos aceptados
            {{volatilityAccepted}} · respaldo EWMA {{volatilityFallback}}.
            Innovaciones: {{stochasticTail}}.
            {{volatilityNote}} La identificación de noticias y los retornos
            esperados fundamentales se evalúan separadamente.
          </p>
          <p>
            Concentración mayor: {{concentration}}. Restricciones cercanas:
            {{nearLimits}}. ETF con retornos por defecto no calibrados en
            la muestra: {{assumedETFCount}}.
          </p>

          <p>
            <strong>Sensibilidad a menor concentración (sin imponer compra):</strong>
            {{shyCapAlternatives}}.
          </p>
          <p>
            Preselección: {{shortlistNote}}. Instrumentos prometedores
            excluidos de la simulación limitada: {{omittedTop}}. Estas
            exclusiones impiden afirmar que se encontró el óptimo global.
          </p>
          <p>
            Referencias verificadas sobre los mismos escenarios:
            {{referenceSummary}}. Son comparaciones, no operaciones sugeridas.
          </p>
          <p>
            Valoración por BPA y múltiplo de salida. Anclas triangulares entre
            los escenarios adverso y favorable, con modo en el base y factores
            de mercado, sector y empresa. Difusión correlacionada {{model}}, con
            respuestas distintas por activo. Parámetros de incertidumbre y
            saltos propios; las probabilidades dependen de estos supuestos.
          </p>
          <p>
            Se conserva el corte, la información utilizada, la semilla y los
            límites al registrar o exportar. La comprobación histórica no
            interviene en la selección.
          </p>
        </details>
      </section>
    </template>

    <template id="composition-etf-holding">
      <tr>
        <td><span class="symbol">{{symbol}}</span></td><td>{{weight}}</td><td>{{group}}</td>
        <td>{{date}}</td><td>{{observed}}</td><td>{{coverage}}</td>
        <td>{{positions}}</td>
        <td>{{{sourceCell}}}</td>
      </tr>
    </template>

    <template id="composition-metric">
      <div>
        <label>{{label}}</label><strong class="{{tone}}">{{value}}</strong
        ><small>{{detail}}</small>
      </div>
    </template>

    <template id="composition-contribution">
      <tr>
        <td><button class="symbol" data-detail="{{symbol}}">{{symbol}}</button></td><td>{{weight}}</td>
        <td>{{returnContribution}}</td>
        <td>{{leftTailContribution}}</td>
        <td>{{varianceContribution}}</td>
      </tr>
    </template>

    <template id="composition-signal">
      <tr>
        <td>
          <button class="symbol" data-detail="{{symbol}}">
            {{symbol}}
          </button>
        </td>
        <td>{{weight}}</td>
        <td>{{low}}</td>
        <td>{{anchor}}</td>
        <td>{{high}}</td>
        <td>{{source}}<small class="composition-valuation-evidence">{{valuationEvidence}}</small><small class="composition-return-split">{{returnSplit}}</small></td>
      </tr>
    </template>
    <template id="composition-dividend-row">
      <tr><td><button class="symbol" data-detail="{{symbol}}">{{symbol}}</button></td><td>{{exDate}}</td><td>{{payDate}}</td><td>{{amount}}</td>
        <td><a href="{{sourceUrl}}" target="_blank" rel="noopener noreferrer">Calendario del emisor</a></td></tr>
    </template>
  </body>
</html>
