<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Plantillas de interfaz</title>
  </head>
  <body>
    <!-- Ex ante composition controls and the recorded model proposal. -->

    <template id="composition-controls">
      <details class="composition-controls">
        <summary>
          LÍMITES DE LA PROPUESTA · {{months}} MESES · CVaR MÁX. {{budget}}
        </summary>
        <div class="composition-fields">
          {{{fields}}}
          <div class="field">
            <label for="composition-volatility">VOLATILIDAD / RIESGO</label>
            <select id="composition-volatility" data-setting="volatilityMode">
              <option value="hybrid" {{{volatilityHybridSelected}}}>GJR validado + EWMA (automático)</option>
              <option value="ewma" {{{volatilityEWMASelected}}}>EWMA diario sin saltos no calibrados</option>
              <option value="legacy" {{{volatilityLegacySelected}}}>Merton legado · solo comparación (saltos no calibrados)</option>
            </select>
          </div>
          <div class="field">
            <label for="composition-dividend-policy">DIVIDENDOS · FLUJO DE CAJA</label>
            <select id="composition-dividend-policy" data-setting="dividendPolicy">
              <option value="cash" {{{dividendsCashSelected}}}>Cobrar en efectivo</option>
              <option value="reinvest" {{{dividendsReinvestSelected}}}>Reinvertir (rendimiento total)</option>
            </select>
          </div>
          <div class="field">
            <label for="composition-dividend-tax">RETENCIÓN SUPUESTA EN DIVIDENDOS</label>
            <div class="input-unit">
              <input id="composition-dividend-tax" type="number" min="0" max="100" step="1"
                value="{{dividendWithholdingValue}}" data-setting="dividendWithholding"
                data-scale="100"><span>%</span>
            </div>
          </div>
          <div class="field">
            <label for="composition-horizon">HORIZONTE</label
            ><select
              id="composition-horizon"
              data-setting="horizon"
              data-numeric
            >
              {{{horizons}}}
            </select>
          </div>
        </div>
        <p>
          Solo posiciones largas. Pesos en pasos de 5 puntos, sin
          apalancamiento; con costos iniciales y efectivo para retiros. SHY
          tiene su propio límite además del global por activo y del conjunto
          Treasury. El tope de oportunidad requiere evidencia prospectiva
          revisada. Dividendos distribuidos se extraen del rendimiento total
          ajustado y la retención es configurable (0% no implica exención tributaria).
          La retención también se descuenta al reinvertir. El flujo se aproxima
          de forma uniforme; no sustituye fechas de pago confirmadas.
        </p>
      </details>
    </template>

    <template id="composition-field">
      <div class="field">
        <label for="composition-{{key}}">{{label}}</label>
        <div class="input-unit">
          <input
            id="composition-{{key}}"
            type="number"
            min="{{min}}"
            max="{{max}}"
            step="{{step}}"
            value="{{value}}"
            data-composition-rule="{{key}}"
            data-scale="{{scale}}"
          /><span>{{unit}}</span>
        </div>
      </div>
    </template>

    <template id="composition-horizon-option">
      <option value="{{value}}" {{{selected}}}>{{label}}</option>
    </template>

    <template id="composition-notice">
      <div class="notice">{{message}}</div>
    </template>

    <template id="composition-report">
      <section class="panel composition-report">
        <div class="panel-header">
          <h2 class="panel-title">PROPUESTA EX ANTE</h2>
          <span class="panel-meta">CORTE {{asOf}}</span>
        </div>
        {{{notice}}}
        <p class="composition-source">{{sourceNotice}}</p>
        <div class="composition-metrics">{{{metrics}}}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ACTIVO</th>
                <th>PESO PROPUESTO</th>
                <th>ANCLA ADVERSA / AÑO</th>
                <th>ANCLA MODO / AÑO</th>
                <th>ANCLA FAVORABLE / AÑO</th>
                <th>DATO PUBLICADO / SUPUESTOS DE VALORACIÓN</th>
              </tr>
            </thead>
            <tbody>
              {{{rows}}}
            </tbody>
          </table>
        </div>
        <div class="composition-contributions">
          <h3>APORTES DE LA CARTERA SIMULADA</h3>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>ACTIVO</th><th>PESO</th>
                <th>APORTE A RETORNO MEDIO</th>
                <th>APORTE A PÉRDIDA EN PEOR 5%</th>
                <th>PORCIÓN DE VARIANZA</th>
              </tr></thead>
              <tbody>{{{attributionRows}}}</tbody>
            </table>
          </div>
          <p class="composition-attribution-note">{{attributionNotice}}</p>
        </div>
        <div class="composition-brief">
          <p>Motor {{engineVersion}} · Corte {{asOf}} · {{simulated}} activos simulados · {{verificationPaths}} escenarios de verificación.</p>
          <p><strong>EXPOSICIÓN PRINCIPAL:</strong> {{concentration}} · Restricciones próximas: {{nearLimits}}.</p>
          <p>{{globalLimitNote}}</p>
          <p>{{exposureSummary}}</p>
          <p>{{incomeSummary}}</p>
          <p>{{shyExplanation}}</p>
          <p><strong>RIESGO TODAVÍA NO VALIDADO:</strong> {{stochasticTail}}.</p>
        </div>
        <details class="composition-method">
          <summary>SUPUESTOS, COMPARACIONES Y VALIDACIÓN · VER DETALLES</summary>
          <p><strong>CORRELACIONES OBSERVADAS · 500 SESIONES:</strong> {{overlapSummary}}.</p>
          <p>{{exposureWarning}}</p>
          <p>{{lookthroughSummary}}</p>
          <p>{{dividendCalendarSummary}}</p>
          <div class="table-wrap">
            <table class="composition-dividend-calendar">
              <thead><tr><th>ACTIVO</th><th>EXDIVIDENDO</th><th>PAGO PREVISTO</th><th>POR PARTICIPACIÓN</th><th>FUENTE</th></tr></thead>
              <tbody>{{{dividendCalendarRows}}}</tbody>
            </table>
          </div>
          <div class="table-wrap">
            <table class="composition-etf-holdings">
              <thead><tr>
                <th>ETF</th><th>PESO</th><th>GRUPO</th>
                <th>FECHA CARTERA</th><th>PRIMERA CAPTURA</th>
                <th>COBERTURA FECHADA</th><th>PRINCIPALES POSICIONES</th><th>FUENTE</th>
              </tr></thead>
              <tbody>{{{etfHoldingsRows}}}</tbody>
            </table>
          </div>
          <p>
            Universo: {{published}} instrumentos publicados,
            {{eligible}} analizables (incluido efectivo sintético),
            {{simulated}} simulados en esta ejecución. La propuesta se
            optimiza sobre esta muestra, no sobre todo el catálogo.
          </p>
          <p>
            Selección según el objetivo del mandato entre {{evaluated}}
            candidatas; {{feasible}} cumplieron los límites de búsqueda.
            {{searchPaths}} escenarios compartidos para comparar y
            {{verificationPaths}} nuevos para comprobar la elegida. Horizonte:
            {{months}} meses.
          </p>
          <p>
            Motor {{engineVersion}} · semilla {{seed}} · tope de correlación
            {{maxCorr}} sobre {{dependenceMethod}} ({{dependenceObservations}}
            sesiones). El riesgo total permanece en Monte Carlo.
          </p>
          <p>
            Riesgo condicional: {{volatilityUsed}} · activos aceptados
            {{volatilityAccepted}} · respaldo EWMA {{volatilityFallback}}.
            Innovaciones: {{stochasticTail}}.
            {{volatilityNote}} La identificación de noticias y los retornos
            esperados fundamentales se evalúan separadamente.
          </p>
          <p>
            Concentración mayor: {{concentration}}. Restricciones cercanas:
            {{nearLimits}}. ETF con retornos por defecto no calibrados en
            la muestra: {{assumedETFCount}}.
          </p>

          <p>
            <strong>Sensibilidad a menor concentración (sin imponer compra):</strong>
            {{shyCapAlternatives}}.
          </p>
          <p>
            Preselección: {{shortlistNote}}. Instrumentos prometedores
            excluidos de la simulación limitada: {{omittedTop}}. Estas
            exclusiones impiden afirmar que se encontró el óptimo global.
          </p>
          <p>
            Referencias verificadas sobre los mismos escenarios:
            {{referenceSummary}}. Son comparaciones, no operaciones sugeridas.
          </p>
          <p>
            Valoración por BPA y múltiplo de salida. Anclas triangulares entre
            los escenarios adverso y favorable, con modo en el base y factores
            de mercado, sector y empresa. Difusión correlacionada {{model}}, con
            respuestas distintas por activo. Parámetros de incertidumbre y
            saltos propios; las probabilidades dependen de estos supuestos.
          </p>
          <p>
            Se conserva el corte, la información utilizada, la semilla y los
            límites al registrar o exportar. La comprobación histórica no
            interviene en la selección.
          </p>
        </details>
      </section>
    </template>

    <template id="composition-etf-holding">
      <tr>
        <td>{{symbol}}</td><td>{{weight}}</td><td>{{group}}</td>
        <td>{{date}}</td><td>{{observed}}</td><td>{{coverage}}</td>
        <td>{{positions}}</td>
        <td>{{{sourceCell}}}</td>
      </tr>
    </template>

    <template id="composition-metric">
      <div>
        <label>{{label}}</label><strong class="{{tone}}">{{value}}</strong
        ><small>{{detail}}</small>
      </div>
    </template>

    <template id="composition-contribution">
      <tr>
        <td>{{symbol}}</td><td>{{weight}}</td>
        <td>{{returnContribution}}</td>
        <td>{{leftTailContribution}}</td>
        <td>{{varianceContribution}}</td>
      </tr>
    </template>

    <template id="composition-signal">
      <tr>
        <td>
          <button class="text-button" data-detail="{{symbol}}">
            {{symbol}}
          </button>
        </td>
        <td>{{weight}}</td>
        <td>{{low}}</td>
        <td>{{anchor}}</td>
        <td>{{high}}</td>
        <td>{{source}}<small class="composition-valuation-evidence">{{valuationEvidence}}</small></td>
      </tr>
    </template>
    <template id="composition-dividend-row">
      <tr><td>{{symbol}}</td><td>{{exDate}}</td><td>{{payDate}}</td><td>{{amount}}</td>
        <td><a href="{{sourceUrl}}" target="_blank" rel="noopener noreferrer">Calendario del emisor</a></td></tr>
    </template>
  </body>
</html>
