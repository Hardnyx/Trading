<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Plantillas de interfaz</title>
  </head>
  <body>
    <template id="chart-scatter-2">
      <g
        ><circle
          cx="{{x}}"
          cy="{{y}}"
          r="5"
          fill="{{value3}}"
          opacity=".85"
        /><text x="{{value4}}" y="{{value5}}" class="scatter-label"
          >{{symbol}}</text
        ><title>{{symbol7}} · Vol {{number}} % · Ret {{number9}} %</title></g
      >
    </template>

    <template id="chart-scatter-3">
      <circle
        cx="{{x}}"
        cy="{{y}}"
        r="10"
        fill="var(--chart-surface)"
        stroke="var(--chart-primary)"
        stroke-width="2"
      /><text
        x="{{x3}}"
        y="{{value4}}"
        text-anchor="middle"
        fill="var(--chart-primary)"
        font-size="10"
        font-weight="bold"
        >P</text
      ><text
        x="{{value5}}"
        y="{{value6}}"
        fill="var(--chart-primary)"
        font-size="10"
        >CARTERA</text
      >
    </template>

    <template id="chart-scatter">
      <svg
        class="scatter-chart"
        viewBox="0 0 {{width}} {{height}}"
        role="img"
        aria-label="Volatilidad y retorno histórico anualizados"
      >
        {{{grids}}}{{{items}}}{{{value5}}}
        <text
          x="{{value6}}"
          y="{{value7}}"
          text-anchor="middle"
          class="axis-label"
        >
          VOLATILIDAD ANUALIZADA →
        </text>
      </svg>
    </template>

    <template id="chart-scatter-4">
      <line
        x1="{{x}}"
        x2="{{x2}}"
        y1="{{t}}"
        y2="{{value4}}"
        class="chart-grid"
      /><line
        x1="{{l}}"
        x2="{{value6}}"
        y1="{{y}}"
        y2="{{y8}}"
        class="chart-grid"
      /><text x="{{x9}}" y="{{value10}}" text-anchor="middle" class="axis-label"
        >{{number}}%</text
      ><text
        x="{{value12}}"
        y="{{value13}}"
        text-anchor="end"
        class="axis-label"
        >{{number14}}%</text
      >
    </template>

    <template id="chart-heatmap">
      <div class="heatmap" data-columns="{{length}}">
        {{{header}}}{{{rows}}}
      </div>
    </template>

    <template id="chart-heatmap-3">
      <div
        class="heat-cell {{tone}}{{value2}}"
        data-heat-opacity="{{opacity}}"
        title="{{s}} / {{j}}: {{number}}"
      >
        {{number7}}
      </div>
    </template>

    <template id="chart-heatmap-2">
      <button class="heat-label" data-detail="{{s}}">{{s2}}</button>{{{items}}}
    </template>

    <template id="chart-heatmap-5">
      <button class="heat-label" data-detail="{{s}}">{{s2}}</button>
    </template>

    <template id="chart-heatmap-4">
      <div class="heat-label heat-corner">ρ</div>
      {{{items}}}
    </template>

    <template id="chart-heatmap-6">
      <div class="empty-chart">La matriz aparecerá al agregar activos.</div>
    </template>
  </body>
</html>
