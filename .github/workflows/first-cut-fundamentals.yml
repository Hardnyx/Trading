name: First-cut fundamentals (manual)
on:
  workflow_dispatch:
    inputs:
      cut:
        description: Decision cut
        required: false
        default: '2024-12-31'
permissions:
  contents: read
concurrency:
  group: first-cut-fundamentals-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - name: Require an identified SEC contact
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: test -n "$SEC_USER_AGENT"
      - name: Reconstruct fundamentals known on the cut
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/first_cut_fundamentals.py --cut "${{ inputs.cut }}"
      - name: Commit the reconstruction
        run: |
          git add data/historical/first-cut-fundamentals-v1
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(history): reconstruct first-cut fundamentals as filed"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
