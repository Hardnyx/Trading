name: Historical price-unit audit (research)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-provider-inputs
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - name: Check split-unit arithmetic, date cutoffs and ambiguous identities
        run: python -m unittest tests.test_historical_price_audit tests.test_historical_replay_plan
      - name: Compare original per-share marks and reconstruct research histories
        id: audit
        continue-on-error: true
        run: python scripts/historical_price_audit.py
      - name: Revalidate component evidence while retaining full-engine blockers
        id: plan
        if: always()
        continue-on-error: true
        run: python scripts/historical_replay_plan.py
      - name: Preserve research histories and source-backed point comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-share-unit-research
          path: |
            out/historical-common-unit-histories-v1.json.gz
            data/historical/price-reconciliation-v1/
            data/historical/replay-plan-v1/
            docs/protocolo-precios-historicos-v1.json
          retention-days: 90
          if-no-files-found: warn
      - name: Publish research diagnostics on main
        if: always()
        run: |
          if [ ! -f data/historical/price-reconciliation-v1/coverage.json ]; then exit 1; fi
          git add data/historical/price-reconciliation-v1 data/historical/replay-plan-v1
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(research): preserve historical price-unit diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep failed audits explicit
        if: steps.audit.outcome != 'success' || steps.plan.outcome != 'success'
        run: exit 1
