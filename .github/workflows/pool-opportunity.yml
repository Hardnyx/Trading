name: Finite-pool opportunity uncertainty (shadow)
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh market data]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/pool_opportunity_audit.mjs'
      - 'scripts/antithetic_selection_research.mjs'
      - 'scripts/antithetic_matrix_research.mjs'
      - 'scripts/economic_sensitivity_research.mjs'
      - 'tests/economic-sensitivity.test.mjs'
      - 'tests/antithetic-matrix.test.mjs'
      - 'tests/antithetic-selection.test.mjs'
      - 'tests/pool-opportunity.test.mjs'
      - 'docs/auditorias/policy-pool-0.34.1.json'
      - 'docs/auditorias/allocation-cuts-0.35.0.json'
      - 'dist/data/market.json'
      - 'dist/data/volatility.json'
      - 'dist/assets/js/**'
      - '.github/workflows/pool-opportunity.yml'
permissions:
  contents: read
concurrency:
  group: finite-pool-opportunity-shadow
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pool-opportunity.test.mjs
      - name: Freeze and assess every alternative with two predeclared seeds
        run: node scripts/pool_opportunity_audit.mjs
      - name: Compare ordinary and antithetic estimates at equal payoff cost
        run: node scripts/antithetic_selection_research.mjs
      - name: Check objective reuse and independent-pair budget accounting
        run: node --test tests/antithetic-matrix.test.mjs
      - name: Exercise a bounded objective and budget matrix, never promote from it
        run: node scripts/antithetic_matrix_research.mjs --quick
      - name: Check isolated assumptions, accounting integrity and signed sensitivity bounds
        run: node --test tests/economic-sensitivity.test.mjs
      - name: Exercise economic sensitivity on the dated reference basket, never authorize trades
        run: node scripts/economic_sensitivity_research.mjs --quick
      - name: Preserve uncertainty without authorizing trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-pool-opportunity
          path: |
            out/pool-opportunity-audit.json
            out/antithetic-selection.json
            out/antithetic-matrix.json
            out/economic-sensitivity.json
          retention-days: 90
