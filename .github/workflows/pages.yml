name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish after a data refresh
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Validate the application
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Stamp asset URLs with deployed Git commit
        run: node scripts/stamp-release.mjs "$(git rev-parse HEAD)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site serves this exact build
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(node -p 'require("./package.json").version')"
          short="${sha:0:12}"
          base="${SITE_URL%/}"
          ready=0
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 20 "${base}/build.json?audit=${sha}" -o /tmp/trading-build.json &&
              EXPECTED_SHA="$sha" EXPECTED_VERSION="$version" node -e '
                const fs = require("node:fs");
                const b = JSON.parse(fs.readFileSync("/tmp/trading-build.json","utf8"));
                if (b.commit !== process.env.EXPECTED_SHA ||
                    b.model_version !== process.env.EXPECTED_VERSION)
                  process.exit(1);
              '; then
              ready=1
              break
            fi
            echo "Waiting for public build ${short} (attempt ${attempt})"
            sleep 8
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Pages does not serve the expected build metadata"
            exit 1
          fi
          curl -fsSL --max-time 20 "${base}/?audit=${sha}" -o /tmp/trading-index.html
          if ! grep -Fq "app.mjs?v=${version}-${short}" /tmp/trading-index.html; then
            echo "::error::Public HTML references stale application modules"
            exit 1
          fi
          curl -fsSL --max-time 20 "${base}/assets/js/app.mjs?v=${version}-${short}" -o /tmp/trading-app.mjs
          if ! grep -Fq "composer-worker.mjs?v=${version}-${short}" /tmp/trading-app.mjs; then
            echo "::error::Public application mixes cached modules"
            exit 1
          fi
          echo "Public build verified: ${version}-${short}"
