name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to publish after a data refresh
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Validate the application
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Stamp asset URLs with deployed Git commit
        run: node scripts/stamp-release.mjs "$(git rev-parse HEAD)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
