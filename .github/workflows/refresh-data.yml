name: Refresh market data
on:
  schedule:
    # 18:30 America/Lima; after the US regular session in both DST regimes.
    - cron: '30 23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-data.yml'
      - 'scripts/refresh_data.py'
      - 'scripts/etf_holdings.py'
      - 'scripts/distributions.py'
      - 'scripts/data_providers.py'
      - 'scripts/bond_profiles.py'
      - 'scripts/universe.py'
      - 'scripts/volatility_research.py'
      - 'scripts/build_volatility.py'
      - 'requirements-research.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
      commit_sha: ${{ steps.snapshot.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Download a public market snapshot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/refresh_data.py
      - name: Calibrate conditional volatility (point-in-time)
        run: python scripts/build_volatility.py
      - name: Seal one prospective proposal per original market close
        run: node scripts/seal_forecast.mjs --skip-ineligible
      - name: Score previously sealed forecasts only after maturity
        run: node scripts/seal_forecast.mjs --score
      - name: Commit the updated snapshot
        id: snapshot
        run: |
          git add dist/data/market.json dist/data/market.json.gz dist/data/volatility.json data/snapshots
          git add data/forecasts data/holdings || true
          if [ -d data/distributions ]; then git add data/distributions; fi
          if [ "$REPOSITORY_PRIVATE" = 'true' ] && [ -d data/research ]; then
            git add -f data/research
          fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): refresh market snapshot'
          # Other source updates can land while the collector downloads data.
          # Rebase the snapshot commit instead of force-pushing or losing changes.
          for attempt in 1 2 3 4; do
            git fetch origin main
            # During rebase, 'theirs' is this job's newly generated snapshot.
            # Other source files are untouched by this data-only commit.
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Snapshot push failed after 4 attempts" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
