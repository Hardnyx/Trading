name: Refresh market data
on:
  schedule:
    # 18:30 America/Lima; after the US regular session in both DST regimes.
    - cron: '30 23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-data.yml'
      - 'scripts/refresh_data.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
      commit_sha: ${{ steps.snapshot.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download a public market snapshot
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/refresh_data.py
      - name: Commit the updated snapshot
        id: snapshot
        run: |
          git add dist/data/market.json data/snapshots
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): refresh market snapshot'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
