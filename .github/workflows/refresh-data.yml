name: Actualizar datos
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar corte de fuentes públicas
        run: python scripts/refresh_data.py
      - name: Guardar datos actualizados
        run: |
          git add dist/data/market.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): actualizar corte de mercado'
          git push origin HEAD:main
