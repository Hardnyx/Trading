name: Research evidence (shadow)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_gate.py'
      - 'scripts/earnings_history.py'
      - 'scripts/earnings_growth_research.py'
      - 'scripts/anchor_information_research.py'
      - 'scripts/gold_research.py'
      - 'scripts/run_research_audit.py'
      - 'scripts/multifactor_research.py'
      - 'scripts/tail_research.py'
      - 'scripts/joint_tail_research.py'
      - 'scripts/news_garchx_research.py'
      - 'scripts/build_event_registry.py'
      - 'scripts/portfolio_stability.mjs'
      - 'scripts/reliability_audit.mjs'
      - 'scripts/simulator_validation.mjs'
      - 'scripts/portfolio_coverage.mjs'
      - 'data/events/verified.json'
      - 'dist/data/market.json'
      - 'dist/data/volatility.json'
      - 'dist/assets/js/**'
      - 'tests/test_research_gate.py'
      - 'tests/test_earnings_history.py'
      - 'tests/test_multifactor_research.py'
      - 'tests/test_tail_research.py'
      - 'tests/test_joint_tail_research.py'
      - 'tests/test_news_garchx_research.py'
      - 'tests/test_build_event_registry.py'
      - '.github/workflows/research-evidence.yml'
permissions:
  contents: read
concurrency:
  group: research-shadow-market
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Archive original-vintage readiness
        run: python scripts/run_research_audit.py --limit 8
      - name: Diagnose annual EPS growth on dated reconstructed filings
        run: python scripts/earnings_growth_research.py
      - name: Measure reconstructed rank IC without changing the declared coefficient
        run: python scripts/anchor_information_research.py
      - name: Contrast lagged gold factors without promoting a gold anchor
        run: python scripts/gold_research.py
      - name: Generate SEC first-seen event ledger
        run: python scripts/build_event_registry.py --limit 8
      - name: Compare multifactor residual GJR against EWMA
        run: python scripts/multifactor_research.py --symbols AMZN,NVDA,SHY --test-days 63 --window 500
      - name: Evaluate VaR/ES and joint tail diagnostics
        run: python scripts/tail_research.py
      - name: Test whether verified SEC releases add GARCH-X value
        run: python scripts/news_garchx_research.py --events out/sec-filing-events.json
      - name: Compare Gaussian vs Student-t joint-return tails
        run: python scripts/joint_tail_research.py
      - name: Audit optimizer robustness to candidates and seeds
        run: node scripts/portfolio_stability.mjs
      - name: Check frozen-input invariants and separate discovery from confirmed decisions
        run: node scripts/reliability_audit.mjs --quick
      - name: Check omitted candidates without promoting unverified trades
        run: node scripts/portfolio_coverage.mjs
      - name: Preserve evidence without publishing unvalidated models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-shadow-evidence
          path: out/*.json
          if-no-files-found: warn
          retention-days: 30
