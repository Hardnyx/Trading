name: Validar aplicación
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/*.json'
      - 'docs/**/*.json'
      - '.github/workflows/**'
      - 'requirements-research.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-fast-main
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/first_cut_source_audit.py --verify
      - run: python scripts/historical_spy_issuer_lei.py --verify
      - run: python scripts/prospective_study_registry.py --verify
      - run: python scripts/overfit_policy_guard.py --verify
      - run: python scripts/ci_workflow_policy.py --verify
      - name: Decide whether the validated commit must be published
        id: release
        if: github.ref == 'refs/heads/main'
        run: python scripts/pages_release_gate.py --site https://hardnyx.github.io/Trading --head "${{ github.sha }}"
  deploy:
    needs: checks
    if: needs.checks.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.sha }}
      skip_python_revalidation: true
