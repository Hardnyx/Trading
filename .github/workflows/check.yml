name: Validar aplicación
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/*.json'
      - 'docs/**/*.json'
      - '.github/workflows/**'
      - 'requirements-research.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-fast-main
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/first_cut_source_audit.py --verify
      - run: python scripts/historical_spy_issuer_lei.py --verify
      - name: Build public SEC issuer LEI research requests
        run: python scripts/historical_spy_issuer_lei.py --csv out/sec-issuer-lei-cusip-2024-12-31.csv --report out/sec-issuer-lei-source-summary-2024-12-31.json
      - name: Retain SEC issuer LEI collection queue
        uses: actions/upload-artifact@v4
        with:
          name: sec-original-issuer-lei-requests
          path: |
            out/sec-issuer-lei-cusip-2024-12-31.csv
            out/sec-issuer-lei-source-summary-2024-12-31.json
          retention-days: 14
          if-no-files-found: error
      - run: python scripts/prospective_study_registry.py --verify
      - run: python scripts/overfit_policy_guard.py --verify
      - run: python scripts/ci_workflow_policy.py --verify
