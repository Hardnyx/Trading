name: Validar aplicación
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/*.json'
      - 'docs/**/*.json'
      - '.github/workflows/**'
      - 'requirements-research.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-fast-main
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/first_cut_source_audit.py --verify
      - run: python scripts/historical_spy_issuer_lei.py --verify
      # Recomputing the 26 cut audits takes minutes; repeat it only when their inputs or code change.
      - name: Look up an earlier verification of the same historical cut audits
        id: cut_audit
        uses: actions/cache/restore@v4
        with:
          path: .cache/cut-audit-verified
          key: cut-audit-${{ hashFiles('scripts/first_cut_input_audit.py', 'data/historical/first-cut-snapshot-v1/**', 'data/historical/price-binding-v1/**', 'data/historical/first-cut-fundamentals-v1/**', 'data/historical/full-engine-input-audit-v1/report*.json') }}
          lookup-only: true
      - name: Verify the historical cut audits
        if: steps.cut_audit.outputs.cache-hit != 'true'
        run: |
          python scripts/first_cut_input_audit.py --verify
          mkdir -p .cache/cut-audit-verified && date -u > .cache/cut-audit-verified/at
      - name: Remember this verification
        if: steps.cut_audit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/cut-audit-verified
          key: cut-audit-${{ hashFiles('scripts/first_cut_input_audit.py', 'data/historical/first-cut-snapshot-v1/**', 'data/historical/price-binding-v1/**', 'data/historical/first-cut-fundamentals-v1/**', 'data/historical/full-engine-input-audit-v1/report*.json') }}
      - run: python scripts/historical_cut_inventory.py --verify
      - run: python scripts/prospective_study_registry.py --verify
      - run: python scripts/overfit_policy_guard.py --verify
      - run: python scripts/ci_workflow_policy.py --verify
      - run: python scripts/timestamp_evidence.py --verify
      - name: Decide whether the validated commit must be published
        id: release
        if: github.ref == 'refs/heads/main'
        run: python scripts/pages_release_gate.py --site https://hardnyx.github.io/Trading --head "${{ github.sha }}"
  deploy:
    needs: checks
    if: needs.checks.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.sha }}
      skip_python_revalidation: true
