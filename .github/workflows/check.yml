name: Validar aplicación
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/first_cut_source_audit.py --verify
      - run: python scripts/historical_identity_requests.py --output out/historical-identity-requests-v1.json.gz
      - run: python scripts/historical_vendor_identity.py --template out/historical-vendor-identity-template.csv
      - run: python scripts/historical_parameter_audit.py
      - run: git fetch --no-tags --depth=1 origin b2d15329e2484ce103d7d729b90c65e4367b218d
      - run: node scripts/benchmark_expanding_mean.mjs out/retrospective-expanding-mean-benchmark-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrospective-expanding-mean-benchmark
          path: out/retrospective-expanding-mean-benchmark-v1.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: historical-parameter-provenance
          path: out/historical-parameter-provenance-v1.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: historical-vendor-identity-template
          path: out/historical-vendor-identity-template.csv
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: historical-identity-requests
          path: out/historical-identity-requests-v1.json.gz
          retention-days: 30
