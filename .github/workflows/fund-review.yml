name: Simulated fund review
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh market data]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: simulated-fund-writer
  cancel-in-progress: false
jobs:
  review:
    # Only a successful refresh provides a new consistent cut to review.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fund-policy.test.mjs tests/strategic-fund.test.mjs
      - name: Review the fund on the latest cut
        run: node scripts/fund_review.mjs
      - name: Commit the review
        id: commit
        run: |
          git add data/fund dist/data/fund.json
          if git diff --cached --quiet; then
            echo "No new review"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(fund): record simulated fund review"
          # Other workflows commit after each refresh: rebase, never force-push.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "Fund review push failed after 4 attempts" >&2
          exit 1
