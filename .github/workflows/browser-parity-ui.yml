name: Validate real browser composition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test_browser_parity.mjs'
      - 'dist/assets/js/**'
      - 'dist/templates/portfolio.html'
      - 'dist/templates/composition.html'
      - 'dist/templates/layout.html'
      - '.github/workflows/browser-parity-ui.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver
        timeout-minutes: 3
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --ignore-scripts --fetch-retries=1 --fetch-timeout=60000 playwright@1.64.1
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Compare rendered portfolio with canonical engine
        timeout-minutes: 4
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: node scripts/test_browser_parity.mjs
      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-composition
          path: out/browser-parity.png
          retention-days: 14
