name: Historical provider inputs (research)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/historical_sources.py'
      - 'scripts/audit_historical_inputs.py'
      - 'tests/test_historical_sources.py'
      - '.github/workflows/historical-sources.yml'
permissions:
  contents: read
concurrency:
  group: historical-provider-inputs
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - name: Check vintage, publication, identity and immutable-source guards
        run: python -m unittest tests.test_historical_sources
      - name: Recover historical macro vintages and original SPY filings
        id: collect
        continue-on-error: true
        timeout-minutes: 20
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/historical_sources.py
      - name: Verify archived bytes and publish the full-replay gap matrix
        id: audit
        continue-on-error: true
        run: python scripts/audit_historical_inputs.py
      - name: Preserve collection evidence even when a source is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-provider-inputs
          path: data/historical/provider-inputs-v1/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish research data with a normal commit on main
        if: steps.collect.outcome != 'skipped'
        run: |
          if [ ! -f data/historical/provider-inputs-v1/manifest.json ]; then exit 1; fi
          git add data/historical/provider-inputs-v1
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(research): preserve historical provider vintages and source availability"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Require an explicit complete collection
        if: steps.collect.outcome != 'success' || steps.audit.outcome != 'success'
        run: |
          echo "Historical recovery is incomplete. Valid sources were preserved; no live inputs or parameters were promoted."
          exit 1
