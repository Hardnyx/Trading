name: First-cut snapshot (manual)
on:
  workflow_dispatch:
    inputs:
      cut:
        description: Decision cut
        required: false
        default: '2024-12-31'
      limit:
        description: First N members only (0 = all)
        required: false
        default: '0'
permissions:
  contents: read
concurrency:
  group: first-cut-snapshot-writer
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - name: Require an identified SEC contact
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: test -n "$SEC_USER_AGENT"
      - name: Reconstruct the market known on the cut
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/first_cut_snapshot.py --cut "${{ inputs.cut }}" --limit "${{ inputs.limit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: first-cut-snapshot
          path: data/historical/first-cut-snapshot-v1
          retention-days: 3
  volatility:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/download-artifact@v4
        with:
          name: first-cut-snapshot
          path: data/historical/first-cut-snapshot-v1
      - name: Calibrate volatility on the reconstructed cut
        run: |
          set -euo pipefail
          base=data/historical/first-cut-snapshot-v1
          name="${{ inputs.cut }}"
          if [ "${{ inputs.limit }}" != "0" ]; then name="$name-smoke"; fi
          gunzip -c "$base/$name.json.gz" > "$RUNNER_TEMP/market.json"
          python scripts/build_volatility.py --snapshot "$RUNNER_TEMP/market.json" \
            --output "$RUNNER_TEMP/volatility.json" --parameter-dir "$base/volatility-parameters-$name"
          gzip -n -c "$RUNNER_TEMP/volatility.json" > "$base/$name.volatility.json.gz"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the engine's reference decision on the cut
        run: |
          name="${{ inputs.cut }}"
          if [ "${{ inputs.limit }}" != "0" ]; then name="$name-smoke"; fi
          node scripts/first_cut_engine.mjs "$name"
      - name: Audit the engine inputs of the cut
        if: inputs.limit == '0'
        run: python scripts/first_cut_input_audit.py --cut "${{ inputs.cut }}"
      - name: Commit the reconstruction
        run: |
          git add data/historical/first-cut-snapshot-v1 data/historical/full-engine-input-audit-v1
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(history): reconstruct the first-cut market snapshot"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
