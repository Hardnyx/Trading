name: Issuer archive capture (manual)
on:
  workflow_dispatch:
    inputs:
      cut:
        description: Decision cut whose issuer pages are captured
        required: false
        default: '2024-12-31'
permissions:
  contents: read
concurrency:
  group: issuer-archive-writer
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture issuer pages archived before the cut
        run: python scripts/issuer_archive_capture.py --cut "${{ inputs.cut }}"
      - name: Commit the captures
        run: |
          git add data/historical/issuer-archive-v1
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(history): archive issuer pages captured before ${{ inputs.cut }}"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
