name: Historical cut reconstruction (manual)
on:
  workflow_dispatch:
    inputs:
      cut:
        description: Calendar cut with a fresh SPY N-PORT source
        required: true
permissions:
  contents: read
concurrency:
  group: historical-cut-${{ inputs.cut }}
  cancel-in-progress: false
jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind SPY positions to public price series
        run: python scripts/historical_price_binding.py --cut "${{ inputs.cut }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binding
          path: data/historical/price-binding-v1/${{ inputs.cut }}.json
          retention-days: 3
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture and parse issuer pages archived before the cut
        run: |
          python scripts/issuer_archive_capture.py --cut "${{ inputs.cut }}"
          python scripts/issuer_archive_profiles.py --cut "${{ inputs.cut }}"
      - uses: actions/upload-artifact@v4
        with:
          name: issuer
          path: data/historical/issuer-archive-v1/${{ inputs.cut }}
          retention-days: 3
  fundamentals:
    needs: binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/download-artifact@v4
        with:
          name: binding
          path: data/historical/price-binding-v1
      - name: Reconstruct fundamentals known on the cut
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT"
          python scripts/first_cut_fundamentals.py --cut "${{ inputs.cut }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals
          path: data/historical/first-cut-fundamentals-v1/${{ inputs.cut }}.json.gz
          retention-days: 3
  snapshot:
    needs: [fundamentals, issuer]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/download-artifact@v4
        with:
          name: binding
          path: data/historical/price-binding-v1
      - uses: actions/download-artifact@v4
        with:
          name: fundamentals
          path: data/historical/first-cut-fundamentals-v1
      - uses: actions/download-artifact@v4
        with:
          name: issuer
          path: data/historical/issuer-archive-v1/${{ inputs.cut }}
      - name: Reconstruct the market known on the cut
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/first_cut_snapshot.py --cut "${{ inputs.cut }}"
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: data/historical/first-cut-snapshot-v1
          retention-days: 3
  engine:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: binding
          path: data/historical/price-binding-v1
      - uses: actions/download-artifact@v4
        with:
          name: fundamentals
          path: data/historical/first-cut-fundamentals-v1
      - uses: actions/download-artifact@v4
        with:
          name: issuer
          path: data/historical/issuer-archive-v1/${{ inputs.cut }}
      - uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: data/historical/first-cut-snapshot-v1
      - name: Calibrate volatility, run the engine and audit its inputs
        run: |
          set -euo pipefail
          cut="${{ inputs.cut }}"
          base=data/historical/first-cut-snapshot-v1
          gunzip -c "$base/$cut.json.gz" > "$RUNNER_TEMP/market.json"
          python scripts/build_volatility.py --snapshot "$RUNNER_TEMP/market.json" \
            --output "$RUNNER_TEMP/volatility.json" --parameter-dir "$base/volatility-parameters-$cut"
          gzip -n -c "$RUNNER_TEMP/volatility.json" > "$base/$cut.volatility.json.gz"
          node scripts/first_cut_engine.mjs "$cut"
          python scripts/first_cut_input_audit.py --cut "$cut"
      - name: Commit the reconstruction
        run: |
          git add data/historical/price-binding-v1 data/historical/first-cut-fundamentals-v1 \
            data/historical/issuer-archive-v1 data/historical/first-cut-snapshot-v1 data/historical/full-engine-input-audit-v1
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(history): reconstruct the ${{ inputs.cut }} cut"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
