name: Refresh historical archive
on:
  schedule:
    # Saturdays 13:17 UTC: after the week's last session and FRED/Fed updates.
    - cron: '17 13 * * 6'
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-archive.yml'
      - 'scripts/history_archive.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archivo-historico
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Check the archive readers
        run: python -m unittest tests.test_history_archive
      - name: Download the long public histories
        run: python scripts/history_archive.py
      - name: Commit the archive
        id: commit
        run: |
          git add data/history dist/data/history-inventory.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): refresh historical archive'
          # Other workflows commit while this one downloads: rebase, never force-push.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Archive push failed after 4 attempts" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: archive
    if: needs.archive.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.archive.outputs.commit_sha }}
