name: Independent SEC 13F source (research)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Test exact 13F original and non-promotional CUSIP-class rules
        run: python -m unittest tests.test_historical_independent_13f
      - name: Acquire and reconcile the fixed Vanguard 2024Q3 original SEC 13F
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/historical_independent_13f.py --collect
      - name: Retain source bytes and CUSIP-class research report
        uses: actions/upload-artifact@v4
        with:
          name: original-independent-vanguard-13f-research
          path: |
            data/historical/independent-13f-v1/
            out/independent-13f-report.json
            out/independent-13f-requests.csv
          retention-days: 60
          if-no-files-found: error
      - name: Preserve exact original SEC 13F on main for reproducibility
        run: |
          git add data/historical/independent-13f-v1/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Alonso Walter Senen Roman Cauti'
          git config user.email 'alonso.roman.c@uni.pe'
          git commit -m 'data(history): archive original 2024Q3 Vanguard SEC 13F'
          git pull --rebase origin main
          git push origin HEAD:main
