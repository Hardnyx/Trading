name: Portfolio diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_portfolio.mjs'
      - 'dist/assets/js/composer.mjs'
      - 'dist/assets/js/universe.mjs'
      - '.github/workflows/diagnose-portfolio.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate published cut with conservative simulation budgets
        run: node scripts/diagnose_portfolio.mjs
