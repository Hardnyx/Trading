name: Timestamp prospective evidence
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh market data, Stock signal validation (prospective), Simulated fund review]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: evidence-timestamp-writer
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify earlier tokens
        run: python scripts/timestamp_evidence.py --verify
      - name: Stamp new or changed evidence with independent authorities
        run: python scripts/timestamp_evidence.py
      - name: Audit v3 admission of monthly captures
        run: python scripts/v3_admission.py > data/timestamps/v3-admission.json
      - name: Commit the tokens
        run: |
          git add data/timestamps
          if git diff --cached --quiet; then
            echo "Nothing new to stamp"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(evidence): record independent timestamps"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Timestamp push failed after 4 attempts" >&2
          exit 1
