name: Research volatility (shadow)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/volatility_research.py'
      - 'scripts/analyze_volatility.py'
      - 'tests/test_volatility_research.py'
      - 'requirements-research.txt'
      - '.github/workflows/research-volatility.yml'
permissions:
  contents: read
jobs:
  volatility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Validate GJR-GARCH-t and chronology
        run: python -m unittest discover -s tests -p 'test_volatility_research.py' -v
      - name: Out-of-sample comparison on published snapshot
        run: python scripts/analyze_volatility.py --symbols SPY,QQQ,TLT,GLD --window 500 --test-days 63 --refit-every 21 --output out/volatility-shadow.json
      - name: Save diagnostic artifact (not public recommendations)
        uses: actions/upload-artifact@v4
        with:
          name: volatility-shadow
          path: out/volatility-shadow.json
          retention-days: 14
